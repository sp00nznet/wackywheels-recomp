# The installer for this commit (recomp-launcher with launcher/launcher.json).
# The game itself is never in it: the installer builds from the player's own
# copy. A private repo: run by hand only (REPO_RULES section 8).
name: installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    uses: sp00nznet/recomp-launcher/.github/workflows/installer.yml@v0.3.0
    with:
      launcher-ref: v0.3.0
      name: WackyWheels-Recomp-Installer
      platforms: windows
